name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies including local microphone backend
        run: uv sync --group dev --extra mic
      - name: Test
        run: uv run pytest -q
      - name: Compile Python sources
        run: uv run python -m compileall -q src tests
